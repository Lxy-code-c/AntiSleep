name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build universal .app
        run: |
          cd macOS
          chmod +x build.sh
          VERSION="$(echo "${GITHUB_REF_NAME#v}" | grep -E '^[0-9]+\.[0-9]+' || echo)"
          echo "version=$VERSION"
          VERSION="$VERSION" ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AntiSleep-macOS
          path: macOS/AntiSleep-macOS.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Build exe
        run: |
          cd windows
          $ver = "${{ github.ref_name }}".TrimStart("v")
          go build -ldflags="-H windowsgui -s -w -X main.appVersion=$ver" -o AntiSleep.exe .
      - name: Embed icon + sign
        shell: pwsh
        run: |
          python -m pip install --quiet --disable-pip-version-check pefile pillow
          python tools\win_icon.py windows\AntiSleep.exe macOS\AppIcon.png
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
                      Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          & $signtool.FullName sign /f windows\signing\AntiSleep.pfx /p antisleep /fd sha256 /v windows\AntiSleep.exe
          $sig = Get-AuthenticodeSignature windows\AntiSleep.exe
          Write-Host "signature status: $($sig.Status) / $($sig.SignerCertificate.Subject)"
          if ($sig.Status -eq 'NotSigned') { throw "签名没写进去" }
      - uses: actions/upload-artifact@v4
        with:
          name: AntiSleep-Windows
          path: windows/AntiSleep.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten
        run: |
          mkdir -p out
          cp dist/AntiSleep-macOS/AntiSleep-macOS.zip out/
          cp dist/AntiSleep-Windows/AntiSleep.exe out/
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          overwrite_files: true
          files: |
            out/AntiSleep-macOS.zip
            out/AntiSleep.exe

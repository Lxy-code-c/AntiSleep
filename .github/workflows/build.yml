name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build universal .app
        run: |
          cd macOS
          chmod +x build.sh
          ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AntiSleep-macOS
          path: macOS/AntiSleep-macOS.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Build exe
        run: |
          cd windows
          go build -ldflags="-H windowsgui -s -w" -o AntiSleep.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: AntiSleep-Windows
          path: windows/AntiSleep.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten
        run: |
          mkdir -p out
          cp dist/AntiSleep-macOS/AntiSleep-macOS.zip out/
          cp dist/AntiSleep-Windows/AntiSleep.exe out/
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/AntiSleep-macOS.zip
            out/AntiSleep.exe
